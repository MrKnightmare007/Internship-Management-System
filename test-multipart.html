<!DOCTYPE html>
<html>
<head>
    <title>Test Multipart Upload</title>
</head>
<body>
    <h2>Test Multipart Upload & Application Submission</h2>
    
    <!-- Simple test first -->
    <h3>1. Simple Upload Test</h3>
    <form id="simpleTestForm">
        <div>
            <label>Test File:</label>
            <input type="file" id="testFile" required>
        </div>
        <br>
        <div>
            <label>Test Data:</label>
            <input type="text" id="testData" value="Hello World" required>
        </div>
        <br>
        <button type="submit">Test Upload</button>
    </form>
    
    <div id="result" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc; background-color: #f9f9f9;"></div>

    <hr>

    <!-- Full application test -->
    <h3>2. Full Application Test (with Documents)</h3>
    <form id="fullApplicationForm">
        <div>
            <label>Program ID:</label>
            <input type="number" id="programId" value="1" required>
        </div>
        <br>
        <div>
            <label>Resume (Required):</label>
            <input type="file" id="resume" accept=".pdf,.doc,.docx" required>
        </div>
        <br>
        <div>
            <label>Cover Letter (Optional):</label>
            <input type="file" id="coverLetter" accept=".pdf,.doc,.docx">
        </div>
        <br>
        <div>
            <label>Academic Transcript (Required):</label>
            <input type="file" id="academicTranscript" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" required>
        </div>
        <br>
        <button type="submit">Submit Full Application</button>
    </form>
    
    <div id="applicationResult" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc; background-color: #f9f9f9;"></div>

    <script>
        // Simple test
        document.getElementById('simpleTestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            const formData = new FormData();
            formData.append('testFile', document.getElementById('testFile').files[0]);
            formData.append('testData', document.getElementById('testData').value);
            
            try {
                const response = await fetch('http://localhost:8080/api/applications/test-upload', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    const result = await response.json();
                    resultDiv.innerHTML = '<strong>SUCCESS:</strong> ' + JSON.stringify(result, null, 2);
                    resultDiv.style.backgroundColor = '#d4edda';
                    resultDiv.style.color = '#155724';
                } else {
                    const error = await response.text();
                    resultDiv.innerHTML = '<strong>ERROR (' + response.status + '):</strong> ' + error;
                    resultDiv.style.backgroundColor = '#f8d7da';
                    resultDiv.style.color = '#721c24';
                }
            } catch (error) {
                resultDiv.innerHTML = '<strong>NETWORK ERROR:</strong> ' + error.message;
                resultDiv.style.backgroundColor = '#f8d7da';
                resultDiv.style.color = '#721c24';
            }
        });

        // Full application test
        document.getElementById('fullApplicationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const applicationResultDiv = document.getElementById('applicationResult');
            applicationResultDiv.innerHTML = 'Submitting application...';
            
            const formData = new FormData();
            formData.append('programId', document.getElementById('programId').value);
            
            // Sample form data
            const applicationData = {
                fullName: "Test Applicant",
                dob: "1995-01-01",
                email: "test@example.com",
                mobile: "1234567890",
                address: "Test Address, Test City",
                collegeNameAddress: "Test College, Test Address",
                universityName: "Test University",
                universityRegNo: "TEST123456",
                courseStream: "Computer Science Engineering",
                currentSemester: "6",
                academicRecords: [
                    {exam: "10th", school: "Test High School", subjects: "All", year: "2010", percentage: "85"},
                    {exam: "12th", school: "Test Higher Secondary", subjects: "PCM", year: "2012", percentage: "88"},
                    {exam: "B.Tech", school: "Test College", subjects: "CSE", year: "2016", percentage: "78"}
                ]
            };
            
            formData.append('formData', JSON.stringify(applicationData));
            
            // Add files
            const resume = document.getElementById('resume').files[0];
            const coverLetter = document.getElementById('coverLetter').files[0];
            const academicTranscript = document.getElementById('academicTranscript').files[0];
            
            if (resume) formData.append('resume', resume);
            if (coverLetter) formData.append('coverLetter', coverLetter);
            if (academicTranscript) formData.append('academicTranscript', academicTranscript);
            
            try {
                const response = await fetch('http://localhost:8080/api/applications', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        // Note: You'll need to add a valid JWT token here for authentication
                        // 'Authorization': 'Bearer YOUR_JWT_TOKEN_HERE'
                    }
                });
                
                if (response.ok) {
                    const result = await response.text();
                    applicationResultDiv.innerHTML = '<strong>SUCCESS:</strong> ' + result;
                    applicationResultDiv.style.backgroundColor = '#d4edda';
                    applicationResultDiv.style.color = '#155724';
                } else {
                    const error = await response.text();
                    applicationResultDiv.innerHTML = '<strong>ERROR (' + response.status + '):</strong> ' + error;
                    applicationResultDiv.style.backgroundColor = '#f8d7da';
                    applicationResultDiv.style.color = '#721c24';
                }
            } catch (error) {
                applicationResultDiv.innerHTML = '<strong>NETWORK ERROR:</strong> ' + error.message;
                applicationResultDiv.style.backgroundColor = '#f8d7da';
                applicationResultDiv.style.color = '#721c24';
            }
        });
    </script>
</body>
</html>
